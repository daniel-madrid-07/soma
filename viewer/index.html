<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOMA — Visor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e1014; --ink: #f2ead9; --muted: #8a8578; --accent: #4fd6c2; --load: #ffb347;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .masthead { position: fixed; top: 28px; left: 34px; z-index: 10; pointer-events: none; }
  .masthead .kicker { font-size: 11px; letter-spacing: .38em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; }
  .masthead h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: 40px; line-height: 1; margin-top: 6px; color: var(--ink); }
  .masthead p { font-size: 12.5px; color: var(--muted); margin-top: 10px; max-width: 300px; line-height: 1.5; }

  .readout { position: fixed; top: 30px; right: 34px; z-index: 10; text-align: right;
    display: grid; gap: 14px; }
  .stat .n { font-family: 'Fraunces', serif; font-size: 30px; line-height: 1; }
  .stat .l { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .dock { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 18px; padding: 12px 20px;
    background: rgba(20,23,28,.72); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.07); border-radius: 2px; }
  .dock button { background: none; border: none; color: var(--ink); cursor: pointer;
    font-family: 'Space Grotesk'; font-size: 14px; letter-spacing: .05em; width: 30px; }
  .dock button:hover { color: var(--accent); }
  #scrub { -webkit-appearance: none; appearance: none; width: 46vw; max-width: 620px; height: 2px;
    background: rgba(255,255,255,.16); outline: none; }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); cursor: pointer; box-shadow: 0 0 12px var(--accent); }
  .tcode { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); min-width: 78px; }
  .hint { position: fixed; bottom: 26px; right: 34px; z-index: 10; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="masthead">
    <div class="kicker">Simulación · sin animación</div>
    <h1 id="title">marcha emergente</h1>
    <p>El cuerpo no reproduce un clip. Cada paso nace de la intención → CPG → actuadores → suelo. Esto solo <em>dibuja</em> la física.</p>
  </div>

  <div class="readout">
    <div class="stat"><div class="n" id="rv">0.00</div><div class="l">m/s · velocidad</div></div>
    <div class="stat"><div class="n" id="rd">0.00</div><div class="l">m · distancia</div></div>
    <div class="stat"><div class="n" id="rc">0</div><div class="l">apoyos · GRF</div></div>
  </div>

  <div class="dock">
    <button id="play">❚❚</button>
    <input type="range" id="scrub" min="0" max="100" value="0" />
    <span class="tcode" id="tcode">0.0 / 0.0 s</span>
  </div>
  <div class="hint">arrastra para orbitar · rueda para zoom</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="frames.js"></script>
  <script>
  (function () {
    const DATA = window.SOMA_FRAMES;
    const meta = DATA.meta, segs = DATA.segments, frames = DATA.frames;
    document.getElementById('title').textContent = (meta.title || 'SOMA').replace('SOMA — ', '');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0e1014');
    scene.fog = new THREE.Fog('#0e1014', 6, 16);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(2.6, 1.5, 3.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('app').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.85, 0);
    controls.enableDamping = true; controls.dampingFactor = 0.06;
    controls.minDistance = 1.5; controls.maxDistance = 9;

    // Luces: clave cálida + relleno frío + rasante de acento.
    scene.add(new THREE.HemisphereLight('#dfe7ff', '#1a1712', 0.5));
    const key = new THREE.DirectionalLight('#ffe9c8', 1.35);
    key.position.set(3, 6, 4); key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048); key.shadow.camera.near = 1; key.shadow.camera.far = 20;
    key.shadow.camera.left = -4; key.shadow.camera.right = 4; key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
    scene.add(key);
    const rim = new THREE.DirectionalLight('#4fd6c2', 0.5); rim.position.set(-4, 2, -3); scene.add(rim);

    // Suelo (plano sim z=0 → mundo y=0).
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ color: '#15181e', roughness: 1, metalness: 0 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = 0; floor.receiveShadow = true;
    scene.add(floor);
    const grid = new THREE.GridHelper(60, 120, 0x2a2f38, 0x1c2027);
    grid.position.y = 0.001; scene.add(grid);

    // root: convierte z-up (simulación) → y-up (three).
    const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);
    const body = new THREE.Group(); root.add(body);   // se traslada para centrar (cinta)

    // Construye una malla por segmento a partir de los metadatos.
    const meshes = segs.map(sg => {
      let geo;
      if (sg.shape === 'sphere') geo = new THREE.SphereGeometry(sg.r, 28, 22);
      else if (sg.shape === 'capsule') {
        geo = new THREE.CylinderGeometry(sg.half[0], sg.half[0], sg.half[2] * 2, 20);
        geo.rotateX(Math.PI / 2);                 // eje del cilindro → z local (eje del hueso)
      } else geo = new THREE.BoxGeometry(sg.half[0] * 2, sg.half[1] * 2, sg.half[2] * 2);
      const mat = new THREE.MeshStandardMaterial({ color: sg.color, roughness: 0.55, metalness: 0.05 });
      const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true;
      m.userData.name = sg.name;
      body.add(m); return m;
    });
    const footIdx = segs.map((s, i) => s.name.startsWith('foot') ? i : -1).filter(i => i >= 0);

    function applyFrame(fi) {
      const fr = frames[fi]; const S = fr.s;
      for (let i = 0; i < meshes.length; i++) {
        const t = S[i];
        meshes[i].position.set(t[0], t[1], t[2]);
        meshes[i].quaternion.set(t[4], t[5], t[6], t[3]);  // three: (x,y,z,w)
      }
      body.position.x = -S[1][0];                 // centra el torso (efecto cinta)
      // Pies: brillan según la fuerza de reacción del suelo (GRF).
      const g = fr.grf || [0, 0];
      footIdx.forEach((idx, k) => {
        const load = Math.min(1, (g[k] || 0) / 1200);
        meshes[idx].material.emissive = new THREE.Color('#ffb347');
        meshes[idx].material.emissiveIntensity = load * 0.9;
      });
    }

    // Lecturas HUD.
    const rv = document.getElementById('rv'), rd = document.getElementById('rd'),
          rc = document.getElementById('rc'), tcode = document.getElementById('tcode');
    const scrub = document.getElementById('scrub'); scrub.max = frames.length - 1;
    const dur = (frames.length - 1) * meta.dt;
    let contacts = 0, prevUp = false;

    function updateReadout(fi) {
      const t = fi * meta.dt;
      const x = frames[fi].s[1][0];
      const win = 10; const j = Math.max(0, fi - win);
      const v = (x - frames[j].s[1][0]) / ((fi - j) * meta.dt || 1);
      rv.textContent = Math.abs(v).toFixed(2);
      rd.textContent = x.toFixed(2);
      const up = (frames[fi].grf[0] > 400) || (frames[fi].grf[1] > 400);
      if (up && !prevUp) contacts++; prevUp = up;
      rc.textContent = contacts;
      tcode.textContent = t.toFixed(1) + ' / ' + dur.toFixed(1) + ' s';
    }

    // Reproducción.
    let idx = 0, playing = true, acc = 0, last = performance.now();
    const playBtn = document.getElementById('play');
    playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; };
    scrub.oninput = () => { idx = +scrub.value; playing = false; playBtn.textContent = '▶';
      contacts = 0; prevUp = false; applyFrame(idx); updateReadout(idx); };

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    applyFrame(0); updateReadout(0);
    function loop(now) {
      const d = (now - last) / 1000; last = now;
      if (playing) {
        acc += d;
        while (acc >= meta.dt) { acc -= meta.dt; idx = (idx + 1) % frames.length;
          if (idx === 0) { contacts = 0; prevUp = false; }
          applyFrame(idx); updateReadout(idx); scrub.value = idx; }
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
