<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOMA — Hacia lo que ve</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0e1014; --ink:#f2ead9; --muted:#8a8578; --accent:#4fd6c2; --goal:#ffb347; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); color:var(--ink);
    font-family:'Space Grotesk',sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; } canvas { display:block; }
  .masthead { position:fixed; top:28px; left:34px; z-index:10; pointer-events:none; max-width:340px; }
  .kicker { font-size:11px; letter-spacing:.38em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  h1 { font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:38px; line-height:1; margin-top:6px; }
  .masthead p { font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.5; }
  .readout { position:fixed; top:30px; right:34px; z-index:10; text-align:right; display:grid; gap:14px; }
  .stat .n { font-family:'Fraunces',serif; font-size:30px; line-height:1; }
  .stat .l { font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-top:4px; }
  .hint { position:fixed; bottom:24px; right:34px; z-index:10; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="masthead">
    <div class="kicker">Visión → locomoción</div>
    <h1>hacia lo que ve</h1>
    <p>El ojo ve el objetivo. El cerebro gira hacia donde aparece en la retina. Las piernas avanzan. La trayectoria curva emerge de ver y corregir — el cuerpo no sabe dónde está la meta, la <em>ve</em>.</p>
  </div>
  <div class="readout">
    <div class="stat"><div class="n" id="rdist">—</div><div class="l">m · al objetivo</div></div>
    <div class="stat"><div class="n" id="rhead">0°</div><div class="l">rumbo</div></div>
  </div>
  <div class="hint">arrastra para orbitar · rueda para zoom</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="nav.js"></script>
  <script>
  (function () {
    const D = window.SOMA_NAV, meta = D.meta, segs = D.segments, frames = D.frames;
    const TGT = meta.target;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0e1014');
    scene.fog = new THREE.Fog('#0e1014', 8, 22);
    const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(-1.5, 5.0, 7.0);
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('app').appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(3, 0.4, -1.75); controls.enableDamping = true; controls.dampingFactor = 0.06;

    scene.add(new THREE.HemisphereLight('#dfe7ff', '#1a1712', 0.5));
    const key = new THREE.DirectionalLight('#ffe9c8', 1.35); key.position.set(3,7,4); key.castShadow = true;
    key.shadow.mapSize.set(2048,2048);
    const sc = key.shadow.camera; sc.near=1; sc.far=24; sc.left=-8; sc.right=8; sc.top=8; sc.bottom=-8;
    scene.add(key);
    const rim = new THREE.DirectionalLight('#4fd6c2',0.45); rim.position.set(-5,2,-4); scene.add(rim);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(80,80),
      new THREE.MeshStandardMaterial({ color:'#15181e', roughness:1 }));
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
    const grid = new THREE.GridHelper(80,160,0x2a2f38,0x1c2027); grid.position.y = 0.001; scene.add(grid);

    // root: z-up (sim) → y-up (three).
    const root = new THREE.Group(); root.rotation.x = -Math.PI/2; scene.add(root);

    // Objetivo: baliza luminosa en (tx,ty).
    const goalMat = new THREE.MeshStandardMaterial({ color:'#ffb347', emissive:'#ffb347', emissiveIntensity:0.8 });
    const goal = new THREE.Mesh(new THREE.SphereGeometry(0.13,24,18), goalMat);
    goal.position.set(TGT[0], TGT[1], 0.9); root.add(goal);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.28,0.34,40),
      new THREE.MeshBasicMaterial({ color:'#ffb347', side:THREE.DoubleSide, transparent:true, opacity:0.5 }));
    ring.position.set(TGT[0], TGT[1], 0.02); root.add(ring);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.8,8),
      new THREE.MeshBasicMaterial({ color:'#ffb347', transparent:true, opacity:0.25 }));
    beam.rotation.x = Math.PI/2; beam.position.set(TGT[0], TGT[1], 0.9); root.add(beam);

    // Estela del recorrido.
    const pathPts = frames.map(f => new THREE.Vector3(f.p[0], f.p[1], 0.02));
    const pathGeo = new THREE.BufferGeometry().setFromPoints(pathPts);
    const path = new THREE.Line(pathGeo, new THREE.LineBasicMaterial({ color:'#4fd6c2', transparent:true, opacity:0.7 }));
    pathGeo.setDrawRange(0,1); root.add(path);

    // Cuerpo.
    const meshes = segs.map(sg => {
      let geo;
      if (sg.shape==='sphere') geo = new THREE.SphereGeometry(sg.r,28,22);
      else if (sg.shape==='capsule'){ geo = new THREE.CylinderGeometry(sg.half[0],sg.half[0],sg.half[2]*2,20); geo.rotateX(Math.PI/2); }
      else geo = new THREE.BoxGeometry(sg.half[0]*2,sg.half[1]*2,sg.half[2]*2);
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:sg.color, roughness:0.55, metalness:0.05 }));
      m.castShadow = true; m.receiveShadow = true; root.add(m); return m;
    });

    const rdist = document.getElementById('rdist'), rhead = document.getElementById('rhead');
    function apply(fi){
      const S = frames[fi].s;
      for (let i=0;i<meshes.length;i++){ const t=S[i];
        meshes[i].position.set(t[0],t[1],t[2]); meshes[i].quaternion.set(t[4],t[5],t[6],t[3]); }
      path.geometry.setDrawRange(0, fi+1);
      const p = frames[fi].p, d = Math.hypot(TGT[0]-p[0], TGT[1]-p[1]);
      rdist.textContent = d.toFixed(2);
      rhead.textContent = Math.round(frames[fi].th*180/Math.PI) + '°';
      goalMat.emissiveIntensity = 0.6 + 0.4*Math.sin(fi*0.3);   // late suave
    }

    let idx=0, acc=0, last=performance.now();
    apply(0);
    addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight); });
    function loop(now){ const dt=(now-last)/1000; last=now; acc+=dt;
      while (acc>=meta.dt){ acc-=meta.dt; idx=(idx+1)%frames.length; apply(idx); }
      controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
